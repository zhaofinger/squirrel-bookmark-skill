interface:
  display_name: "Squirrel 书签"
  short_description: "将公开网页保存到 Squirrel，抓取正文并用 AI 生成标题、摘要和标签"
  default_prompt: "使用 $squirrel-bookmark 抓取公开网页，将抓取结果 JSON 保存到文件，只用 AI 生成 title、summary 和 tags，遵循用户指定的摘要语言、格式、风格和长度偏好；当用户要求记住时，将摘要偏好保存到 ~/.config/squirrel-bookmark/preferences.json。先加载已保存偏好，再应用当前请求覆盖项。通过保存脚本直接读取抓取结果文件中的原始 content 并原样发送到 Squirrel。成功保存后，在最终回复中返回生成的 summary 和实际应用的摘要偏好；即使 API 响应中没有 summary，也以本地生成并提交的内容为准。如果没有 AI 能力，立即停止并返回不可用错误。"
