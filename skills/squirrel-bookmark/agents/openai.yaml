interface:
  display_name: "Squirrel Bookmark"
  short_description: "Save public web pages to the fixed Squirrel bookmark API with AI-generated metadata and customizable summaries"
  default_prompt: "Use $squirrel-bookmark to fetch a public web page, generate bookmark metadata with AI, honor any user-defined summary language, format, style, and length preferences, and store persistent summary preferences only in ~/.config/squirrel-bookmark/preferences.json when the user asks to remember them. Load saved preferences from that file before applying defaults, expose the applied summary preferences in the response, and save the bookmark to Squirrel. If AI capability is unavailable, stop and return an unavailable error."
