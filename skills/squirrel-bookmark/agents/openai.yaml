interface:
  display_name: "Squirrel Bookmark"
  short_description: "Save public web pages to the fixed Squirrel bookmark API with AI-generated metadata and customizable summaries"
  default_prompt: "Use $squirrel-bookmark to fetch a public web page, save the fetch result JSON to a file, generate only title, summary, and tags with AI, honor any user-defined summary language, format, style, and length preferences, and store persistent summary preferences only in ~/.config/squirrel-bookmark/preferences.json when the user asks to remember them. Load saved preferences from that file before applying defaults. Do not let the model reproduce, trim, or re-escape the raw content field. Save the bookmark with the helper so raw content is read directly from the fetch result file and sent unchanged to Squirrel. In the final user-facing response, always include the generated summary after a successful save instead of returning only a generic success confirmation. Use the locally generated and submitted summary as the source of truth even if the bookmark API response does not include summary. Expose the applied summary preferences in the response. If AI capability is unavailable, stop and return an unavailable error."
